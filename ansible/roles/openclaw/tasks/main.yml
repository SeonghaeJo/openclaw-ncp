---
- name: Install CA certificates before runtime resolution
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true

- name: Resolve current supported runtime when no installation profile exists
  ansible.builtin.copy:
    src: resolve_runtime.py
    dest: /tmp/openclaw-ncp-resolve-runtime.py
    mode: '0700'
  when: openclaw_version == 'auto' or node_version == 'auto'

- name: Query current OpenClaw stable and compatible Node LTS
  ansible.builtin.command:
    argv: [/usr/bin/python3, /tmp/openclaw-ncp-resolve-runtime.py]
  register: runtime_resolution
  changed_when: false
  when: openclaw_version == 'auto' or node_version == 'auto'

- name: Select resolved runtime
  ansible.builtin.set_fact:
    openclaw_version: "{{ (runtime_resolution.stdout | from_json).openclaw_version if openclaw_version == 'auto' else openclaw_version }}"
    node_version: "{{ (runtime_resolution.stdout | from_json).node_version if node_version == 'auto' else node_version }}"
    node_sha256: "{{ (runtime_resolution.stdout | from_json).node_sha256 if node_sha256 == 'auto' else node_sha256 }}"
    openclaw_artifact_url: "{{ (runtime_resolution.stdout | from_json).openclaw_tarball if openclaw_artifact_url == 'auto' else openclaw_artifact_url }}"
    openclaw_artifact_integrity: "{{ (runtime_resolution.stdout | from_json).openclaw_integrity if openclaw_artifact_integrity == 'auto' else openclaw_artifact_integrity }}"
  when: runtime_resolution is defined and runtime_resolution.stdout | length > 0

- name: Recompute resolved Node path
  ansible.builtin.set_fact:
    node_root: "/opt/node-v{{ node_version }}-linux-x64"

- name: Enforce supported scope before mutation
  ansible.builtin.assert:
    that:
      - openclaw_new_host_ack | bool
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('24.04', '>=')
      - ansible_architecture == 'x86_64'
      - openclaw_gateway_mode == 'local'
      - openclaw_gateway_bind == 'loopback'
      - openclaw_gateway_auth_mode == 'token'
      - openclaw_gateway_port | int > 1024
      - openclaw_gateway_port | int < 65536
      - openclaw_user is match('^[a-z_][a-z0-9_-]*$')
      - openclaw_home is match('^/[a-zA-Z0-9_/-]+$')
      - openclaw_env_dir is match('^/[a-zA-Z0-9_/-]+$')
      - openclaw_gateway_env_file is match('^/[a-zA-Z0-9_./-]+$')
      - openclaw_gateway_env_file == openclaw_env_dir + '/gateway.env'
      - openclaw_env_dir == openclaw_home + '/.config/openclaw'
      - (openclaw_tailscale_ready | bool and openclaw_device_pair_public_url is match('^https://[^/]+$')) or (not openclaw_tailscale_ready | bool and openclaw_device_pair_public_url == '')
      - tailscale_package_state == 'present'
      - tailscale_package_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
      - tailscale_keyring_checksum is match('^sha256:[0-9a-f]{64}$')
      - node_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
      - openclaw_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
      - node_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: 'Only acknowledged NEW Ubuntu x86_64 hosts and local/loopback/token baseline are supported.'

- name: Install Tailscale repository keyring
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: "{{ tailscale_keyring }}"
    mode: '0644'
    checksum: "{{ tailscale_keyring_checksum }}"

- name: Configure Tailscale package repository
  ansible.builtin.apt_repository:
    repo: "{{ tailscale_repository }}"
    filename: tailscale
    state: present
    update_cache: true

- name: Install bootstrap OS packages
  ansible.builtin.apt:
    name: [xz-utils, git, python3, acl, build-essential, iproute2, "tailscale={{ tailscale_package_version }}"]
    state: "{{ tailscale_package_state }}"
    update_cache: true
    cache_valid_time: 86400

- name: Ensure Tailscale service is enabled (login remains an operator step)
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started

- name: Check Tailscale login before enabling OpenClaw Serve
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: tailscale_status
  changed_when: false
  no_log: true
  failed_when: openclaw_tailscale_ready | bool and tailscale_status.rc != 0

- name: Verify Tailscale is enrolled before enabling OpenClaw Serve
  ansible.builtin.assert:
    that:
      - not (openclaw_tailscale_ready | bool) or tailscale_status.rc == 0
      - not (openclaw_tailscale_ready | bool) or (tailscale_status.stdout | from_json).BackendState == 'Running'
      - not (openclaw_tailscale_ready | bool) or (tailscale_status.stdout | from_json).Self.Online | bool
      - not (openclaw_tailscale_ready | bool) or (tailscale_status.stdout | from_json).Self.DNSName is string
      - not (openclaw_tailscale_ready | bool) or (openclaw_device_pair_public_url | urlsplit('hostname')) == ((tailscale_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', ''))
    fail_msg: 'Tailscale must be enrolled and online, and device-pair URL must match this host MagicDNS name before Serve is enabled.'

- name: Create service user with explicit home
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    home: "{{ openclaw_home }}"
    shell: /bin/bash
    create_home: true

- name: Resolve primary group
  ansible.builtin.command:
    argv: [id, -gn, "{{ openclaw_user }}"]
  register: user_group
  changed_when: false

- name: Download exact upstream Node archive
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: "/var/cache/node-v{{ node_version }}-linux-x64.tar.xz"
    checksum: "sha256:{{ node_sha256 }}"
    mode: '0644'

- name: Extract dedicated pinned Node runtime
  ansible.builtin.unarchive:
    src: "/var/cache/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: /opt
    remote_src: true
    creates: "{{ node_root }}/bin/node"

- name: Create user directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ user_group.stdout }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: '{{ openclaw_workspace }}', mode: '0755'}
    - {path: '{{ openclaw_home }}/.npm-global', mode: '0755'}
    - {path: '{{ openclaw_home }}/.openclaw', mode: '0700'}
    - {path: '{{ openclaw_agent_workspace }}', mode: '0700'}
    - {path: '{{ openclaw_env_dir }}', mode: '0700'}
    - {path: '{{ openclaw_home }}/.local/lib/openclaw-ncp', mode: '0700'}
    - {path: '{{ openclaw_home }}/.config/systemd/user/openclaw-gateway.service.d', mode: '0755'}

- name: Preserve npmrc while converging prefix
  ansible.builtin.lineinfile:
    path: "{{ openclaw_home }}/.npmrc"
    regexp: '^\s*prefix\s*='
    line: "prefix={{ openclaw_home }}/.npm-global"
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ user_group.stdout }}"
    mode: '0600'

- name: Preserve profile while managing runtime PATH
  ansible.builtin.blockinfile:
    path: "{{ openclaw_home }}/.profile"
    marker: '# {mark} OPENCLAW NCP PATH'
    block: 'export PATH="{{ openclaw_home }}/.npm-global/bin:{{ node_root }}/bin:$PATH"'
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ user_group.stdout }}"
    mode: '0644'

- name: Install convergence helper
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ openclaw_home }}/.local/lib/openclaw-ncp/{{ item }}"
    owner: "{{ openclaw_user }}"
    group: "{{ user_group.stdout }}"
    mode: '0700'

  loop: [converge.py, npm-artifacts.json]

- name: Prepare user configuration without shell or token argv
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    PATH: "{{ openclaw_home }}/.npm-global/bin:{{ node_root }}/bin:/usr/bin:/bin"
    OPENCLAW_CONFIG_PATH: "{{ openclaw_home }}/.openclaw/openclaw.json"
    OPENCLAW_STATE_DIR: "{{ openclaw_home }}/.openclaw"
    NCP_SUPPLIED_TOKEN: "{{ openclaw_gateway_token }}"
    NCP_ROTATE_TOKEN: "{{ openclaw_rotate_token | bool | ternary('1', '0') }}"
    NCP_OPENCLAW_VERSION: "{{ openclaw_version }}"
    NCP_NODE_VERSION: "{{ node_version }}"
    NCP_NPM_VERSION: "{{ npm_version if npm_version != 'auto' else '' }}"
    NCP_OPENCLAW_URL: "{{ openclaw_artifact_url }}"
    NCP_OPENCLAW_INTEGRITY: "{{ openclaw_artifact_integrity }}"
  ansible.builtin.command:
    argv: [/usr/bin/python3, '{{ openclaw_home }}/.local/lib/openclaw-ncp/converge.py', prepare, '{{ openclaw_gateway_env_file }}', '{{ openclaw_agent_workspace }}', '{{ openclaw_gateway_port | string }}', '{{ node_root }}', '{{ openclaw_device_pair_public_url }}', '{{ openclaw_tailscale_ready | ternary("1", "0") }}']
  register: prepared
  changed_when: "'CHANGED' in prepared.stdout"
  no_log: true

# gateway install starts immediately; drop-in MUST precede the CLI call.
- name: Supply SecretRef before any service start
  ansible.builtin.copy:
    dest: "{{ openclaw_home }}/.config/systemd/user/openclaw-gateway.service.d/20-ncp-env.conf"
    content: "[Service]\nEnvironmentFile={{ openclaw_gateway_env_file }}\n"
    owner: "{{ openclaw_user }}"
    group: "{{ user_group.stdout }}"
    mode: '0644'
  register: env_dropin

- name: Read linger state
  ansible.builtin.command:
    argv: [loginctl, show-user, '{{ openclaw_user }}', -p, Linger, --value]
  register: linger
  changed_when: false
  failed_when: false

- name: Enable linger when needed
  ansible.builtin.command:
    argv: [loginctl, enable-linger, '{{ openclaw_user }}']
  when: linger.rc != 0 or linger.stdout != 'yes'
  changed_when: true

- name: Resolve uid
  ansible.builtin.command:
    argv: [id, -u, '{{ openclaw_user }}']
  register: openclaw_uid
  changed_when: false

- name: Start user manager
  ansible.builtin.systemd_service:
    name: "user@{{ openclaw_uid.stdout }}.service"
    state: started

- name: Wait for user bus
  ansible.builtin.wait_for:
    path: "/run/user/{{ openclaw_uid.stdout }}/bus"
    timeout: 30

- name: Converge and verify service under its owner
  become_user: "{{ openclaw_user }}"
  environment:
    HOME: "{{ openclaw_home }}"
    PATH: "{{ openclaw_home }}/.npm-global/bin:{{ node_root }}/bin:/usr/bin:/bin"
    OPENCLAW_CONFIG_PATH: "{{ openclaw_home }}/.openclaw/openclaw.json"
    OPENCLAW_STATE_DIR: "{{ openclaw_home }}/.openclaw"
    XDG_RUNTIME_DIR: "/run/user/{{ openclaw_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ openclaw_uid.stdout }}/bus"
    NCP_RESTART: "{{ (prepared.changed or env_dropin.changed) | ternary('1', '0') }}"
    NCP_OPENCLAW_VERSION: "{{ openclaw_version }}"
    NCP_NODE_VERSION: "{{ node_version }}"
    NCP_NPM_VERSION: "{{ npm_version if npm_version != 'auto' else '' }}"
    NCP_OPENCLAW_URL: "{{ openclaw_artifact_url }}"
    NCP_OPENCLAW_INTEGRITY: "{{ openclaw_artifact_integrity }}"
  ansible.builtin.command:
    argv: [/usr/bin/python3, '{{ openclaw_home }}/.local/lib/openclaw-ncp/converge.py', service, '{{ openclaw_gateway_env_file }}', '{{ openclaw_agent_workspace }}', '{{ openclaw_gateway_port | string }}', '{{ node_root }}', '{{ openclaw_device_pair_public_url }}', '{{ openclaw_tailscale_ready | ternary("1", "0") }}']
  register: serviced
  changed_when: "'CHANGED' in serviced.stdout"
  no_log: true

- name: Persist non-secret installation metadata
  become_user: "{{ openclaw_user }}"
  ansible.builtin.copy:
    dest: "{{ openclaw_home }}/.config/openclaw/lifecycle.json"
    mode: '0600'
    content: "{{ {'schema': 1, 'openclaw_version': openclaw_version, 'node_version': node_version, 'node_root': node_root, 'gateway_port': (openclaw_gateway_port | int), 'tailscale_ready': (openclaw_tailscale_ready | bool), 'updated_at': ansible_date_time.iso8601} | to_nice_json }}\n"
