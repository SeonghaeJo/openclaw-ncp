---
- name: Require Debian/Ubuntu
  ansible.builtin.assert:
    that: ansible_os_family == "Debian"

- name: Install bootstrap packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git]
    state: present
    update_cache: true

- name: Create dev user
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Read current Node major
  ansible.builtin.shell: "node --version 2>/dev/null | sed -E 's/^v([0-9]+).*/\\1/' || true"
  args:
    executable: /bin/bash
  register: current_node_major
  changed_when: false

- name: Configure NodeSource Node 24 repository
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "https://deb.nodesource.com/setup_{{ node_major }}.x" | bash -
  args:
    executable: /bin/bash
  when: current_node_major.stdout != node_major

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node major
  ansible.builtin.shell: |
    test "$(node --version | sed -E 's/^v([0-9]+).*/\1/')" = "{{ node_major }}"
  args:
    executable: /bin/bash
  changed_when: false

- name: Create workspace and npm prefix
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0755"
  loop:
    - "{{ openclaw_workspace }}"
    - "{{ openclaw_home }}/.npm-global"

- name: Configure npm prefix
  ansible.builtin.copy:
    dest: "{{ openclaw_home }}/.npmrc"
    content: "prefix={{ openclaw_home }}/.npm-global\n"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0600"

- name: Put npm global bin on PATH
  ansible.builtin.lineinfile:
    path: "{{ openclaw_home }}/.profile"
    line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"

- name: Read installed OpenClaw version
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    export PATH="{{ openclaw_home }}/.npm-global/bin:$PATH"
    openclaw --version 2>/dev/null | awk '{print $2}' || true
  args:
    executable: /bin/bash
  register: installed_openclaw_version
  changed_when: false

- name: Install pinned OpenClaw
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ openclaw_home }}/.npm-global/bin:$PATH"
    npm install -g "openclaw@{{ openclaw_version }}"
  args:
    executable: /bin/bash
  when: installed_openclaw_version.stdout != openclaw_version

# Prepare user systemd before installing/starting the Gateway.
- name: Enable linger
  ansible.builtin.command: "loginctl enable-linger {{ openclaw_user }}"
  changed_when: false

- name: Resolve dev uid
  ansible.builtin.command: "id -u {{ openclaw_user }}"
  register: openclaw_uid
  changed_when: false

- name: Start user systemd manager
  ansible.builtin.systemd:
    name: "user@{{ openclaw_uid.stdout }}.service"
    state: started

- name: Wait for user runtime dir
  ansible.builtin.wait_for:
    path: "/run/user/{{ openclaw_uid.stdout }}"
    state: present
    timeout: 20

- name: Create secret env directory
  ansible.builtin.file:
    path: "{{ openclaw_env_dir }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0700"

- name: Write Gateway secret env file
  ansible.builtin.copy:
    dest: "{{ openclaw_gateway_env_file }}"
    content: "OPENCLAW_GATEWAY_TOKEN={{ openclaw_gateway_token }}\n"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0600"
  no_log: true
  register: gateway_secret

# Non-interactive onboarding records gateway.mode=local and stores the token as
# an environment SecretRef instead of plaintext.
- name: Initialize Gateway config with token SecretRef
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ openclaw_home }}/.npm-global/bin:$PATH"
    export OPENCLAW_GATEWAY_TOKEN="{{ openclaw_gateway_token }}"
    openclaw onboard       --non-interactive       --accept-risk       --mode local       --gateway-auth token       --gateway-token-ref-env OPENCLAW_GATEWAY_TOKEN       --gateway-bind "{{ openclaw_gateway_bind }}"       --skip-health       --skip-bootstrap
    openclaw config set gateway.port "{{ openclaw_gateway_port }}"
    openclaw config set gateway.auth.mode "{{ openclaw_gateway_auth_mode }}"
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false

- name: Check Gateway unit
  ansible.builtin.stat:
    path: "{{ openclaw_home }}/.config/systemd/user/openclaw-gateway.service"
  register: gateway_unit

- name: Install Gateway user service
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ openclaw_home }}/.npm-global/bin:$PATH"
    export XDG_RUNTIME_DIR="/run/user/{{ openclaw_uid.stdout }}"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
    export OPENCLAW_GATEWAY_TOKEN="{{ openclaw_gateway_token }}"
    openclaw gateway install
  args:
    executable: /bin/bash
  no_log: true
  when: not gateway_unit.stat.exists

- name: Inject Gateway environment file into user unit
  ansible.builtin.blockinfile:
    path: "{{ openclaw_home }}/.config/systemd/user/openclaw-gateway.service"
    insertafter: '^\[Service\]$'
    marker: "# {mark} ANSIBLE MANAGED GATEWAY ENV"
    block: |
      EnvironmentFile={{ openclaw_gateway_env_file }}
  owner: "{{ openclaw_user }}"
  group: "{{ openclaw_user }}"
  mode: "0644"
  register: gateway_unit_env

- name: Reload and restart Gateway when config/secret changed
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR="/run/user/{{ openclaw_uid.stdout }}"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
    systemctl --user daemon-reload
    systemctl --user enable openclaw-gateway.service
    systemctl --user restart openclaw-gateway.service
  args:
    executable: /bin/bash
  when: gateway_unit_env.changed or gateway_secret.changed or not gateway_unit.stat.exists

- name: Ensure Gateway is running
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR="/run/user/{{ openclaw_uid.stdout }}"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
    systemctl --user start openclaw-gateway.service
  args:
    executable: /bin/bash
  changed_when: false

- name: Wait for loopback Gateway
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ openclaw_gateway_port }}"
    state: started
    timeout: 30

- name: Verify Gateway config and service
  become_user: "{{ openclaw_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="{{ openclaw_home }}/.npm-global/bin:$PATH"
    export OPENCLAW_GATEWAY_TOKEN="{{ openclaw_gateway_token }}"
    test "$(openclaw config get gateway.mode)" = "local"
    test "$(openclaw config get gateway.bind)" = "loopback"
    test "$(openclaw config get gateway.port)" = "{{ openclaw_gateway_port }}"
    test "$(openclaw config get gateway.auth.mode)" = "token"
    openclaw gateway status
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false
